name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reject tracked official translation files
        run: python scripts/check_public_tree.py
      # The installer downloads the rights holder's official PDF, builds the
      # Chinese corpus locally, and runs the full offline test suite. No PDF
      # or corpus is committed. build_corpus.py keeps the CDN cookie and
      # retries, because a clean clone without data/rules.jsonl cannot pass
      # the corpus tests; a failed download is a real install failure.
      - name: Verify Unix installer path
        if: runner.os != 'Windows'
        run: sh setup.sh --offline-check
      - name: Verify Windows cmd installer path
        if: runner.os == 'Windows' && matrix.python-version == '3.10'
        shell: cmd
        run: setup.cmd --offline-check
      - name: Verify Windows PowerShell installer path
        if: runner.os == 'Windows' && matrix.python-version == '3.13'
        shell: pwsh
        run: .\setup.ps1 --offline-check
      - name: Ensure generated files are ignored
        run: python -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain']).strip()"
